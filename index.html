<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Peak 11 Media</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background:
      radial-gradient(900px 500px at 80% -10%, rgba(143,199,232,0.08), transparent 60%),
      radial-gradient(700px 400px at 0% 0%, rgba(212,162,78,0.06), transparent 55%),
      linear-gradient(180deg, #0e1420 0%, #0a0e14 45%);
    color: #e9eef4;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; text-align: center; -webkit-font-smoothing: antialiased;
  }
  .peak { display: inline-flex; align-items: center; gap: 12px; margin-bottom: 26px; }
  .peak svg { width: 40px; height: 40px; }
  .brand { font-size: 16px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; }
  .brand span { color: #d4a24e; }
  h1 {
    font-size: clamp(28px, 7vw, 44px); font-weight: 800; letter-spacing: -1px;
    background: linear-gradient(180deg, #fff, #c4d3e0);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  p.sub { color: #8b97a6; margin-top: 16px; font-size: 16px; line-height: 1.5; max-width: 460px; }
  a.cta {
    display: inline-block; margin-top: 32px; text-decoration: none;
    color: #0a0e14; font-weight: 700; font-size: 15px; letter-spacing: 0.3px;
    background: linear-gradient(180deg, #8fc7e8, #d4a24e);
    padding: 14px 30px; border-radius: 999px;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  a.cta:hover { transform: translateY(-2px); box-shadow: 0 12px 26px -12px rgba(143,199,232,0.6); }
</style>
</head>
<body>
  <div>
    <div class="peak">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M4 40 L18 12 L26 26 L31 18 L44 40 Z" fill="#1b2735" stroke="#3d6c8c" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M18 12 L14 20 L18 19 L21 24 L26 26 Z" fill="#dbe7f0"/>
        <path d="M31 18 L29 22 L32 22 L34 26 L37 23 Z" fill="#dbe7f0"/>
      </svg>
      <span class="brand">Peak 11 <span>Media</span></span>
    </div>
    <h1>Websites that win<br>local business.</h1>
    <p class="sub">Custom-built sites for trades and small businesses across the Wasatch Front.</p>
    <a class="cta" href="./review/">View the Portfolio &rarr;</a>
  </div>
</body>
</html>
